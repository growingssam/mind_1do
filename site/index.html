<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FBF7EC"><title>오늘도 1도 마음온도 · 마음정원 산책 미리보기</title><style>



:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  --canvas: #FBF7EC;
  --paper: #FFFDF7;
  --paper-warm: #F8F5EC;
  --ink: #3F3428;
  --text: #5A5044;
  --muted: #81766A;
  --sage: #AFCB9A;
  --sage-deep: #607953;
  --sage-soft: #EFF4E9;
  --honey: #F3C96B;
  --honey-soft: #FFF4D9;
  --line: #E8E1D4;
  --rose: #F7DDD0;
  --rose-ink: #804838;
  --shadow: 0 12px 36px rgba(83, 73, 52, .045);
  --radius: 24px;
}
* { box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); line-height: 1.65; letter-spacing: -.025em; word-break: keep-all; overflow-wrap: break-word; }
button, input, textarea { font: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #7EA16C; outline-offset: 3px; }
h1,h2,h3,h4,p { margin: 0; }
a { color: inherit; }

/* A deliberately restrained palette, including legacy utility classes. */
.bg-lime-50 { background-color: var(--sage-soft) !important; }
.bg-lime-100 { background-color: #E4EEDB !important; }
.bg-amber-50 { background-color: var(--honey-soft) !important; }
.bg-amber-100 { background-color: #FAEBC6 !important; }
.bg-rose-50 { background-color: #FFF4EF !important; }
.bg-rose-100 { background-color: var(--rose) !important; }
.text-lime-700,.text-lime-800 { color: var(--sage-deep) !important; }
.text-rose-700,.text-rose-900 { color: var(--rose-ink) !important; }
.text-stone-600 { color: var(--muted) !important; }
.text-stone-700,.text-stone-800,.text-stone-900 { color: var(--ink) !important; }
.ring-amber-100,.ring-lime-100,.border-amber-100,.border-rose-100 { --tw-ring-color: var(--line) !important; border-color: var(--line) !important; }

.app-shell { min-height: 100vh; background: var(--canvas); }
.page-frame { position: relative; max-width: 1152px; min-height: 100vh; margin: 0 auto; padding: 22px 28px 30px; }
.app-header { min-height: 72px; display: flex; align-items: center; gap: 24px; justify-content: space-between; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.brand-mark { display: inline-flex; align-items: center; text-align: left; gap: 11px; flex-shrink: 0; }

.brand-kicker { display: block; margin-bottom: 2px; font-size: 11px; font-weight: 700; line-height: 1.3; color: var(--sage-deep); letter-spacing: .015em; }
.brand-title { display: block; font-size: 22px; line-height: 1.15; font-weight: 800; letter-spacing: -.055em; color: var(--ink); }
.app-nav { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
.nav-pill { display: inline-grid; place-items: center; white-space: nowrap; min-height: 43px; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 650; color: #766D60; transition: background .15s ease; }
.nav-pill:hover { background: #F2EEE4; }

.header-actions { display: flex; align-items: center; gap: 10px; }
.header-mode { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--muted); font-size: 11px; font-weight: 700; }
.mobile-menu-button { display: none; border: 1px solid var(--line); background: var(--paper); border-radius: 11px; width: 42px; height: 42px; place-items: center; }
.mobile-menu-overlay { display: none; }
.main-content { min-height: 70vh; padding-bottom: 34px; }
.site-footer { display: flex; justify-content: space-between; gap: 12px; padding: 28px 0 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.mobile-tabbar { display: none; }
.crisis-float { position: fixed; z-index: 40; right: max(24px, calc((100vw - 1152px)/2 + 28px)); bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 17px; border: 1px solid #E4C4B4; border-radius: 100px; box-shadow: 0 7px 24px rgba(107,74,60,.13); background: #F9E8DF; color: #7B4538; font-size: 13px; font-weight: 750; }
.crisis-float:hover { background: var(--rose); }

/* Base design system */
.app-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; min-width: 0; }
.app-button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 19px; border-radius: 13px; font-size: 14px; font-weight: 750; line-height: 1.4; text-align: center; transition: background .16s ease, transform .16s ease, border-color .16s ease; }
.app-button:hover:not(:disabled) { transform: translateY(-1px); }
.app-button:disabled { opacity: .5; }
.app-button-primary { background: var(--sage-deep); color: white; }
.app-button-primary:hover:not(:disabled) { background: #526C47; }

.app-button-brown { background: var(--ink); color: white; }
.app-button-ghost { background: var(--paper); border: 1px solid var(--line); color: var(--text); }
.app-button-outline { background: #F2F6ED; border: 1px solid #C9D8BB; color: var(--sage-deep); }

.app-chip { text-align: left; min-height: 49px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 13px; background: white; color: var(--text); font-size: 14px; font-weight: 650; line-height: 1.45; transition: background .16s ease, border-color .16s ease; }
.app-chip:hover { background: #F9F7F0; }
.app-chip-selected { border-color: #AFC89C; background: var(--sage-soft); color: #45623F; box-shadow: inset 0 0 0 1px #AFC89C; }
.app-input { border-radius: 15px; border: 1px solid #DEDACF; padding: 15px 17px; background: white; min-height: 114px; color: var(--ink); font-size: 15px; line-height: 1.78; resize: vertical; }
.app-input::placeholder { color: #9A9186; }
.app-input:focus { outline: 3px solid #DDEAD2; border-color: #789D69; }
.section-header { margin-bottom: 26px; }
.section-eyebrow { color: var(--sage-deep); text-transform: none; letter-spacing: .045em; line-height: 1.35; font-weight: 750; font-size: 12px; }
.section-title { margin-top: 7px; color: var(--ink); font-size: clamp(26px, 3vw, 34px); line-height: 1.32; font-weight: 800; letter-spacing: -.058em; }
.section-desc { margin-top: 13px; max-width: 700px; white-space: pre-line; color: var(--text); font-size: 15px; line-height: 1.86; }
.app-card h3 { line-height: 1.43; }
.app-card .text-xl.font-black { font-size: 19px; }
.app-card .text-sm { line-height: 1.7; }
.app-card .font-black { font-weight: 800; }
.app-card .font-bold { font-weight: 750; }
.app-card .mt-5 { margin-top: 24px; }
.app-card .mb-3 { margin-bottom: 12px; }
.app-card .grid.gap-2 { gap: 9px; }
.app-card .grid.gap-3 { gap: 12px; }
.app-card .grid.gap-4 { gap: 16px; }

/* First screen: designed as an independent editorial landing, not a template hero card. */
.home-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .94fr); gap: 22px; align-items: stretch; }
.home-hero { position: relative; isolation: isolate; grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .76fr); align-items: center; overflow: hidden; min-height: 410px; padding: 48px 48px 44px; border: 1px solid #E3E6D7; border-radius: 30px; background: #EEF1E5; }
.home-hero::before { content: ''; pointer-events: none; position: absolute; width: 510px; height: 510px; border-radius: 50%; background: #F7F6ED; opacity: .55; right: -210px; top: -255px; z-index: -1; }
.hero-content { position: relative; z-index: 2; }
.hero-identifier { display: inline-flex; align-items: center; gap: 7px; color: #637F5B; font-size: 12px; font-weight: 730; }
.identifier-dot { width: 7px; height: 7px; border-radius: 50%; background: #86AA77; }
.hero-title { margin-top: 17px; color: #3B4335; font-size: clamp(40px, 4.7vw, 60px); line-height: 1.17; letter-spacing: -.074em; font-weight: 850; }
.hero-title em { font-style: normal; color: #69885F; }
.hero-subtitle { margin-top: 16px; font-size: 17px; line-height: 1.3; font-weight: 800; letter-spacing: -.04em; color: #3F4D3A; }

.hero-cta { display: inline-flex; align-items: center; justify-content: space-between; gap: 30px; min-height: 52px; margin-top: 25px; padding: 13px 20px; border-radius: 13px; background: #667F59; color: white; font-size: 14px; font-weight: 750; transition: background .2s ease, transform .2s ease; }
.hero-cta:hover { background: #526A47; transform: translateY(-1px); }
.hero-tiny { margin-top: 15px; font-size: 12px; color: #6B7767; }
.garden-art { display: block; width: min(100%, 425px); height: auto; margin: 0 auto; filter: drop-shadow(0 16px 18px rgba(94,117,80,.06)); }
.hero-side-note { position: absolute; right: 42px; bottom: 29px; font-size: 12px; color: #81957A; text-align: right; line-height: 1.6; }

.record-mode-panel { align-self: stretch; border: 1px solid var(--line); border-radius: 25px; padding: 24px; background: var(--paper); }
.record-mode-heading { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.mini-leaf { flex: 0 0 auto; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--sage-soft); color: var(--sage-deep); }
.record-mode-heading strong { display: block; font-size: 18px; line-height: 1.4; font-weight: 790; }
.record-mode-heading p { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.65; }
.record-mode-options { display: grid; gap: 10px; }
.record-mode-choice { display: flex; width: 100%; min-height: 86px; gap: 12px; align-items: center; padding: 15px; text-align: left; border: 1px solid var(--line); border-radius: 16px; background: #FEFCF7; color: #737266; }
.record-mode-choice.selected { border-color: #A6C19A; background: #F0F6EB; color: #5A8050; }
.record-mode-choice > span:nth-child(2) { flex: 1; }
.record-mode-choice strong { display: block; color: var(--ink); font-size: 15px; font-weight: 760; }

.choice-check { display: grid; place-items: center; flex: 0 0 auto; width: 20px; height: 20px; border: 1px solid #C7C8B9; border-radius: 50%; font-size: 12px; font-weight: 900; }
.record-mode-choice.selected .choice-check { background: #7D9C71; border-color: #7D9C71; color: white; }
.mode-fineprint { margin-top: 13px; padding: 0 2px; color: var(--muted); font-size: 12px; line-height: 1.65; }

.menu-panel { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 25px; background: var(--paper); }
.menu-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.menu-panel-header h3 { margin-top: 5px; color: var(--ink); font-size: 20px; line-height: 1.35; letter-spacing: -.045em; font-weight: 780; }
.menu-panel-decoration { display: grid; place-items: center; color: #BCA26B; width: 39px; height: 39px; background: #FFF5DC; border-radius: 50%; }
.home-menu-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.home-menu-card { position: relative; min-width: 0; display: flex; align-items: flex-start; flex-direction: column; gap: 11px; min-height: 140px; padding: 15px; border: 1px solid #ECE6DC; border-radius: 17px; background: #FFFDF9; text-align: left; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
.home-menu-card:hover { transform: translateY(-2px); border-color: #C5D7B5; background: #FAFCF5; }
.home-menu-card > svg:last-child { position: absolute; top: 19px; right: 15px; color: #9B9C8D; }
.menu-icon { display: grid; place-items: center; width: 41px; height: 41px; border-radius: 13px; color: #718E68; background: #EBF0E5; }
.menu-tone-1 .menu-icon,.menu-tone-4 .menu-icon { color: #9F8050; background: #FAEBD0; }
.menu-tone-5 .menu-icon { color: var(--rose-ink); background: #F9E5DD; }
.menu-copy { display: block; }
.home-menu-card strong { display: block; color: var(--ink); font-size: 15px; line-height: 1.38; font-weight: 790; letter-spacing: -.025em; }
.home-menu-card small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.56; }
.home-quiet-note { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 11px; padding: 15px 5px 0; border-top: 1px solid var(--line); color: var(--muted); }
.home-quiet-note p { font-size: 12px; line-height: 1.75; }

/* Guided pages */
.step-wrap { margin: 3px 0 28px; }
.step-labels { display: flex; gap: 7px; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: 730; color: #A4A094; }
.step-labels .is-active { color: var(--sage-deep); }
.step-track { background: #EAE8DE; height: 6px; border-radius: 100px; overflow: hidden; }
.step-fill { height: 100%; background: #86A97B; border-radius: inherit; transition: width .22s; }
.mood-panel { padding: 36px; }
.temperature-card { min-height: 106px; padding: 16px 8px; border: 1px solid var(--line); border-radius: 15px; text-align: center; background: white; color: var(--ink); }
.temperature-card:hover { background: #F6F8F1; }
.temperature-card-selected { border-color: #95B187; background: #EDF5E7; box-shadow: inset 0 0 0 1px #95B187; }

/* Toolbox */
.toolbox-panel,.tool-detail-panel { padding: 24px; align-self: start; }
.toolbox-panel > .tool-picker-grid { grid-template-columns: 1fr; }
.tool-select-card { display: block; width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 15px; background: white; text-align: left; transition: background .15s, border-color .15s; }
.tool-select-card:hover { background: #FAFCF7; }
.tool-select-card-active { border-color: #A9C49E; background: var(--sage-soft); }
.tool-select-card .text-2xl { flex: 0 0 auto; display: grid; place-items: center; width: 43px; height: 43px; border-radius: 13px; background: #F3F6ED; font-size: 22px; }
.tool-select-card h3 { color: var(--ink); font-size: 15px; line-height: 1.42; font-weight: 780; }
.tool-select-card p { color: var(--muted); font-size: 12px; line-height: 1.55; }
.tool-header { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 24px; }
.tool-emblem { flex: 0 0 auto; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 17px; background: #F0F3E9; font-size: 27px; }
.tool-header h3 { font-size: 21px; line-height: 1.4; font-weight: 800; letter-spacing: -.04em; }
.tool-header p { margin-top: 7px; color: var(--text); font-size: 14px; line-height: 1.8; white-space: pre-line; }
.private-notice { display: flex; align-items: flex-start; gap: 8px; margin-top: 17px; padding: 13px; border-radius: 13px; background: var(--sage-soft); color: #536C4B; font-size: 12px; line-height: 1.65; }
.private-notice > svg { flex-shrink: 0; margin-top: 1px; }
.bean-piece { display: inline-block; width: 17px; height: 23px; border-radius: 58% 44% 50% 48%; background: #B38A63; transform: rotate(-31deg); position: relative; }
.bean-piece::after { position: absolute; content:''; left: 7px; top: 4px; width: 4px; height: 15px; border-left: 1px solid #F6DFB3; border-radius: 100%; }
.done-card { position: relative; padding: 38px 28px; text-align: center; }
.done-sprout { margin: 0 auto; display: grid; place-items: center; width: 65px; height: 65px; border-radius: 20px; background: var(--sage-soft); color: var(--sage-deep); font-size: 22px; font-weight: 900; }
.done-card h2 { margin-top: 24px; font-size: 22px; line-height: 1.45; font-weight: 790; }
.done-card > p { margin: 11px auto 0; max-width: 420px; color: var(--text); font-size: 14px; line-height: 1.84; white-space: pre-line; }
.done-card .done-mode-note { margin: 20px auto 0; max-width: 340px; padding: 11px 13px; border-radius: 11px; background: var(--sage-soft); color: var(--sage-deep); font-size: 12px; }

/* Help and record pages */
.help-numbers { display: grid; gap: 8px; margin-top: 17px; padding: 17px; border-radius: 16px; background: #FFF6E5; }
.help-numbers p { margin-bottom: 7px; font-size: 14px; color: var(--text); line-height: 1.65; }
.help-numbers a { display: flex; align-items: center; justify-content: space-between; gap: 9px; min-height: 45px; padding: 10px 12px; border: 1px solid #F0E0C4; border-radius: 11px; background: white; font-size: 14px; font-weight: 700; text-decoration: none; }

.record-intro .section-header { text-align: left; }
.record-intro-art { display: grid; place-items: center; height: 112px; width: 112px; margin: 7px auto 20px; border-radius: 35px; color: var(--sage-deep); background: var(--sage-soft); }
.record-intro h3 { font-size: 21px; font-weight: 770; }
.record-intro > p { margin: 9px auto 20px; max-width: 430px; font-size: 14px; line-height: 1.84; color: var(--text); }

/* Comfortable tablet widths */
@media (max-width: 1150px) {
  .app-header { gap: 10px; }
  .app-nav { gap: 0; }

}
@media (max-width: 850px) {

  .header-mode { display: inline-flex; }

  .mobile-menu-sheet { display: grid; gap: 4px; max-width: 510px; margin-left: auto; padding: 20px; border: 1px solid var(--line); border-radius: 19px; background: var(--paper); box-shadow: 0 18px 45px rgba(55,48,33,.17); }
  .mobile-menu-sheet > button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 11px 10px; min-height: 46px; border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 700; }
  .mobile-menu-sheet > button:hover { background: var(--sage-soft); }

  .main-content { padding-bottom: 142px; }
  .site-footer { display: none; }
  .mobile-tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); padding: 7px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(255,253,247,.98); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(84,66,45,.04); }
  .mobile-tabbar button { display: flex; min-width: 0; align-items: center; flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; border-radius: 11px; color: #857B6D; font-size: 10px; font-weight: 730; }
  .mobile-tabbar button.active { color: var(--sage-deep); background: var(--sage-soft); }
  .crisis-float { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); right: 14px; min-height: 40px; padding: 9px 13px; font-size: 12px; }
  .home-layout { grid-template-columns: 1fr; gap: 16px; }

}
@media (max-width: 580px) {

  .hero-identifier { font-size: 11px; }
  .hero-title { margin-top: 16px; font-size: clamp(36px, 10.4vw, 43px); line-height: 1.19; }
  .hero-subtitle { margin-top: 14px; font-size: 15px; }
  .hero-copy { margin-top: 9px; font-size: 13.5px; line-height: 1.85; }
  .hero-cta { margin-top: 19px; width: auto; min-height: 49px; font-size: 13px; gap: 21px; }
  .hero-tiny { margin-top: 11px; font-size: 10.5px; }
  .garden-art { position: absolute; right: -24px; bottom: -5px; width: 254px; max-width: none; opacity: .92; }
  .hero-side-note { bottom: 28px; right: auto; left: 25px; font-size: 10px; text-align: left; }
  .record-mode-panel,.menu-panel { padding: 19px; border-radius: 20px; }
  .record-mode-choice { padding: 13px 12px; min-height: 77px; }
  .record-mode-choice small { font-size: 11px; }
  .home-menu-grid { gap: 9px; }
  .home-menu-card { padding: 13px 12px; min-height: 149px; gap: 9px; }

2><p class=\"section-desc\">친구의 마음을 모두 알 수는 없지만,\n바로 판단하기 전에 한 번 더 생각해볼 수 있어요.<\/p><\/div><div class=\"grid gap-4 lg:grid-cols-[0.9fr_1.1fr]\"><div class=\"grid gap-2\"><button class=\"app-chip app-chip-selected\" type=\"button\">친구가 내 말을 못 들은 것 같아요.<\/button><button class=\"app-chip\" type=\"button\">친구가 나랑 놀지 않았어요.<\/button><button class=\"app-chip\" type=\"button\">친구가 내 표정을 보고도 그냥 갔어요.<\/button><button class=\"app-chip\" type=\"button\">친구가 장난으로 한 말이 나에게는 속상했어요.<\/button><button class=\"app-chip\" type=\"button\">친구가 약속을 잊어버렸어요.<\/button><\/div><div class=\"rounded-3xl bg-lime-50 p-5\"><h3 class=\"text-xl font-black\">친구가 내 말을 못 들은 것 같아요.<\/h3><ul class=\"mt-4 grid gap-2 text-sm leading-6 text-stone-700\"><li>• 친구는 일부러 그랬을까요?<\/li><li>• 다른 이유가 있었을까요?<\/li><li>• 내가 확인해볼 수 있는 말은 무엇일까요?<\/li><li>• 내가 지금 할 수 있는 가장 안전한 선택은 무엇일까요?<\/li><\/ul><div class=\"mt-4 rounded-2xl bg-white p-4 text-sm leading-7 text-stone-600\">“아까 내 말을 못 들은 거야? 나는 조금 속상했어.”<br/>“혹시 네가 장난으로 한 말이었어도, 나는 조금 마음이 아팠어.”<br/>“나는 이렇게 느꼈어. 다음에는 이렇게 말해줄 수 있을까?”<\/div><p class=\"mb-3 mt-5 font-bold\">내 말로 바꿔 써보기<\/p><textarea class=\"app-input w-full resize-none\" placeholder=\"내가 확인해보고 싶은 말을 적어보세요.\" rows=\"4\" value=\"\"><\/textarea><div class=\"mt-4 flex flex-wrap gap-2\"><button class=\"app-button app-button-primary\" disabled=\"\" type=\"button\">연습 마치기<\/button><button class=\"app-button app-button-honey\" disabled=\"\" type=\"button\">문장 복사하기<\/button><\/div><\/div><\/div><\/div>", "practice": "<div class=\"app-card mx-auto max-w-4xl p-6\"><div class=\"section-header\"><p class=\"section-eyebrow\">관계 기술<\/p><h2 class=\"section-title\">관계 회복 문장 연습<\/h2><p class=\"section-desc\">상황별로 말 연습을 해볼 수 있어요.\n내 마음도 지키고 친구의 마음도 생각하는 문장을 연습해보세요.<\/p><\/div><div class=\"grid gap-4 lg:grid-cols-[0.9fr_1.1fr]\"><div class=\"grid gap-2\"><button class=\"app-chip app-chip-selected\" type=\"button\">친구와 싸웠어요<\/button><button class=\"app-chip\" type=\"button\">내가 미안한 일이 있어요<\/button><button class=\"app-chip\" type=\"button\">친구에게 속상한 말을 들었어요<\/button><button class=\"app-chip\" type=\"button\">같이 놀고 싶은데 말하기 어려워요<\/button><button class=\"app-chip\" type=\"button\">거절하고 싶은데 못 하겠어요<\/button><button class=\"app-chip\" type=\"button\">어른에게 말하고 싶지만 망설여져요<\/button><\/div><div class=\"rounded-3xl bg-amber-50 p-5\"><h3 class=\"text-xl font-black\">친구와 싸웠어요<\/h3><p class=\"mt-2 text-sm leading-6 text-stone-600\">“너 때문에”보다 “나는 이렇게 느꼈어”로 말해보세요.<\/p><div class=\"mt-4 grid gap-2\"><button class=\"app-chip app-chip-selected\" type=\"button\">아까 내가 크게 말해서 미안해.<\/button><button class=\"app-chip\" type=\"button\">조금 진정하고 다시 이야기해도 될까?<\/button><\/div><p class=\"mb-3 mt-5 font-bold\">내 말로 바꿔보기<\/p><textarea class=\"app-input w-full resize-none\" placeholder=\"아까 내가 크게 말해서 미안해.\" rows=\"4\" value=\"\"><\/textarea><div class=\"mt-4 flex flex-wrap gap-2\"><button class=\"app-button app-button-primary\" type=\"button\">연습 마치기<\/button><button class=\"app-button app-button-honey\" type=\"button\">문장 복사하기<\/button><\/div><\/div><\/div><\/div>", "records": "<div class=\"app-card mx-auto max-w-4xl p-6 record-intro\"><div class=\"section-header\"><p class=\"section-eyebrow\">나의 작은 흔적<\/p><h2 class=\"section-title\">나의 마음기록<\/h2><p class=\"section-desc\">기록은 선택이에요. 지금은 마음연습 모드라 아무것도 저장하지 않아요.<\/p><\/div><div class=\"record-intro-art\"><svg aria-hidden=\"true\" fill=\"none\" height=\"42\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\" viewbox=\"0 0 24 24\" width=\"42\"><path d=\"M12 6c-2-2-5-2-9-2v15c4 0 7 0 9 2 2-2 5-2 9-2V4c-4 0-7 0-9 2zm0 0v15\"><\/path><\/svg><\/div><h3>기록을 남기고 싶은가요?<\/h3><p>개인 휴대폰이나 집에서 쓰는 기기라면 기록 모드로 바꿀 수 있어요. 공용 아이패드에서는 연습 모드를 권해요.<\/p><button class=\"app-button app-button-primary\" type=\"button\">개인 기기에서 기록하기<\/button><p class=\"record-caveat\">저장한 글은 비밀번호로 보호되지 않아요. 같은 브라우저의 다른 사용자도 볼 수 있습니다.<\/p><\/div>", "help": "<section class=\"grid gap-5\"><div class=\"app-card p-6\"><div class=\"section-header\"><p class=\"section-eyebrow\">책임 있는 의사결정<\/p><h2 class=\"section-title\">도움이 필요할 때<\/h2><p class=\"section-desc\">혼자 들고 있기 어려운 마음은\n어른과 함께 나누어도 괜찮아요.\n바로 말하기 어렵다면,\n먼저 말할 문장을 골라볼 수 있어요.<\/p><\/div><p class=\"rounded-2xl bg-lime-50 p-4 text-sm leading-6 text-stone-600\">이 화면은 선생님에게 자동으로 알리는 기능이 아니에요. 가까운 어른에게 말할 수 있는 문장을 연습하고 도움 안내를 받는 공간이에요.<\/p><\/div><div class=\"grid gap-5 lg:grid-cols-3\"><div class=\"app-card\"><h3 class=\"text-xl font-black\">1단계. 혼자 정리해볼래요<\/h3><p class=\"mt-2 text-sm leading-6 text-stone-600\">말하기 전에 마음을 정리해보는 것도 나를 돌보는 1도예요.<\/p><div class=\"mt-4 grid gap-2\"><button class=\"app-button app-button-ghost\" type=\"button\">속마음 서랍에 적기<\/button><button class=\"app-button app-button-ghost\" type=\"button\">걱정 정리함 열기<\/button><button class=\"app-button app-button-ghost\" type=\"button\">나를 데우는 말 고르기<\/button><button class=\"app-button app-button-ghost\" type=\"button\">마음 잠시 내려놓기<\/button><\/div><\/div><div class=\"app-card lg:col-span-2\"><h3 class=\"text-xl font-black\">2단계. 어른에게 말할 문장을 연습할래요<\/h3><p class=\"mt-2 text-sm leading-6 text-stone-600\">도움을 요청하는 건 약한 것이 아니에요. 혼자 들고 있기 어려운 마음을 나누는 것도 나를 지키는 1도입니다.<\/p><div class=\"mt-4 grid gap-2 sm:grid-cols-2\"><button class=\"app-chip app-chip-selected\" type=\"button\">요즘 마음이 조금 힘들어요.<\/button><button class=\"app-chip\" type=\"button\">자세히 말하기는 어렵지만 도움이 필요해요.<\/button><button class=\"app-chip\" type=\"button\">혼자 들고 있기 어려운 마음이 있어요.<\/button><button class=\"app-chip\" type=\"button\">친구관계 때문에 속상해요.<\/button><button class=\"app-chip\" type=\"button\">지금은 누가 옆에 있어주면 좋겠어요.<\/button><button class=\"app-chip\" type=\"button\">보건실이나 상담실에 가고 싶어요.<\/button><button class=\"app-chip\" type=\"button\">보호자와 이야기하고 싶어요.<\/button><button class=\"app-chip\" type=\"button\">지금은 자세히 말하기 어렵지만 알아주셨으면 좋겠어요.<\/button><\/div><p class=\"mb-3 mt-5 font-bold\">내 말로 바꿔 쓰기<\/p><textarea class=\"app-input w-full resize-none\" placeholder=\"요즘 마음이 조금 힘들어요.\" rows=\"3\" value=\"\"><\/textarea><div class=\"mt-4 flex flex-wrap gap-2\"><button class=\"app-button app-button-primary\" type=\"button\">문장 복사하기<\/button><button class=\"app-button app-button-honey\" type=\"button\">화면에 크게 보여주기<\/button><\/div><\/div><\/div><div class=\"app-card border border-rose-100 p-6\"><h3 class=\"text-xl font-black text-rose-900\">3단계. 지금 바로 어른 도움이 필요해요<\/h3><p class=\"mt-3 whitespace-pre-line rounded-2xl bg-rose-50 p-4 leading-7 text-stone-700\">지금 혼자 있기 어렵거나,\n나를 다치게 하고 싶은 마음이 들거나,\n너무 무서운 생각이 계속 난다면\n이 사이트에 적는 것보다\n가까운 어른에게 바로 말하는 것이 먼저예요.<\/p><div class=\"mt-4 grid gap-2 sm:grid-cols-4\"><button class=\"app-button app-button-softalert\" type=\"button\">가까운 어른에게 보여줄 문장<\/button><button class=\"app-button app-button-honey\" type=\"button\">보건실/상담실에 가고 싶어요<\/button><button class=\"app-button app-button-honey\" type=\"button\">보호자에게 말하기<\/button><button class=\"app-button app-button-ghost\" type=\"button\">전화 안내 접기<\/button><\/div><div class=\"help-numbers\" id=\"help-numbers\"><p>지금 바로 도움이 필요하다면 가까운 어른에게 먼저 말해요. 전화로도 도움을 받을 수 있어요.<\/p><a href=\"tel:1388\">청소년상담 1388 <span>전화하기 ↗<\/span><\/a><a href=\"tel:109\">자살예방상담전화 109 <span>전화하기 ↗<\/span><\/a><a href=\"tel:112\">긴급 신고 112 <span>전화하기 ↗<\/span><\/a><a href=\"tel:119\">긴급 구조 119 <span>전화하기 ↗<\/span><\/a><\/div><\/div><\/section>"};

const state={page:'home',mode:'practice',moodStep:0,weather:'',emotion:'',temp:null,recommendation:'',tool:0,stretch:0,helpPhrase:'요즘 마음이 조금 힘들어요.',friend:friendSituations[0],situation:'친구와 싸웠어요',sentence:'아까 내가 크게 말해서 미안해.'};
const main=document.querySelector('main.main-content');
const q=s=>document.querySelector(s);

function toast(text){document.querySelector('.preview-message')?.remove();const t=document.createElement('div');t.className='preview-message';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function setMode(m){state.mode=m==='personal'?'personal':'practice';if(state.page==='home'||state.page==='records') go(state.page);else updateModeLabels();}
function updateModeLabels(){document.querySelectorAll('.header-mode').forEach(e=>e.textContent=state.mode==='personal'?'내 기기 기록 모드':'기록하지 않는 연습 모드');}
function go(page){state.page=page in STATIC?page:'home';main.innerHTML=STATIC[state.page];
 if(state.page==='home'){const options=main.querySelectorAll('.record-mode-choice');options.forEach((b,i)=>{const active=(state.mode==='practice')===(i===0);b.classList.toggle('selected',active);b.setAttribute('aria-pressed',active?'true':'false');b.querySelector('.choice-check').textContent=active?'✓':''});const note=main.querySelector('.mode-fineprint');if(note) note.textContent=state.mode==='practice'?'현재 연습 모드예요. 글을 써도 저장되거나 전송되지 않아요.':'이 브라우저에 저장해요. 같은 브라우저를 쓰는 다른 사람도 볼 수 있습니다.';}
 if(state.page==='mood'){state.moodStep=0;drawMood()}
 if(state.page==='tools' && state.tool!==null) {showTool(state.tool,false)}
 if(state.page==='records') drawRecords();
 document.querySelectorAll('.nav-pill,.mobile-tabbar button').forEach(b=>{const name=b.textContent.trim();const active=name===pageNames[state.page]||(state.page==='home'&&name==='처음');b.classList.toggle('nav-pill-active',active);b.classList.toggle('is-active',active) });updateModeLabels();window.scrollTo({top:0,behavior:'instant'});
}
function chip(text,selected=false){return `<button class="app-chip ${selected?'app-chip-selected':''}" type="button" data-choice="${escapeHTML(text)}">${escapeHTML(text)}</button>`}
function btn(text,fn,disabled=false,variant='primary'){return `<button type="button" class="app-button app-button-${variant}" data-action="${fn}" ${disabled?'disabled':''}>${escapeHTML(text)}</button>`}
function drawMood(){let opts=[],title='',value='';const n=state.moodStep;
 if(n===0){title='오늘 내 마음 날씨는 어떤가요?';opts=weather;value=state.weather}
 if(n===1){title='오늘 내 마음에 가까운 말을 골라보세요.';opts=emotions;value=state.emotion}
 if(n===2){title='오늘 내 마음온도는 몇 도쯤인가요?';opts=temp.map((d,i)=>`${i+1}도 · ${d}`);value=state.temp===null?'':opts[state.temp-1]}
 if(n===3){title='오늘의 다음 1도를 골라보세요.';opts=recommendations[state.emotion]||['나를 데우는 말 고르기','고마움 콩알 모으기','오늘은 쉬기'];value=state.recommendation}
 main.innerHTML=`<div class="app-card mx-auto max-w-3xl mood-panel">${content('오늘 마음온도')}<p class="quiet" style="margin-bottom:20px">마음온도는 점수가 아니에요. 오늘 내 마음을 알아차리는 작은 기록이에요.</p><div class="step-wrap"><div class="step-labels">${[0,1,2,3].map(i=>`<span class="${i===n?'is-active':''}">${i+1}단계</span>`).join('')}</div><div class="step-track"><div class="step-fill" style="width:${(n+1)*25}%"></div></div></div><h3 style="font-size:19px;font-weight:800;margin:23px 0 17px">${title}</h3><div class="wizard-options ${n===2?'cols-five':''}">${opts.map(o=>chip(o,o===value)).join('')}</div>${n===2?'<p class="preview-footnote">낮은 온도도 괜찮아요. 마음을 알아차린 것만으로도 충분해요.</p>':''}<div class="preview-actions">${n>0?btn('이전','moodBack',false,'ghost'):'<span></span>'}${btn(n===3?(state.mode==='personal'?'내 기기에 저장하기':'연습 마치기'):'다음','moodNext',n===0?!state.weather:n===1?!state.emotion:n===2?!state.temp:!state.recommendation)}</div></div>`;
}
function save(type,data){if(state.mode!=='personal')return false;const key='mindtemp_'+type;let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch{}a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:new Date().toLocaleString('ko-KR'),type,...data});localStorage.setItem(key,JSON.stringify(a));return true}
function safeText(text){return /죽고\s*싶|자해|죽을래|그만\s*살|나를\s*다치게|사라지고\s*싶|없어지고\s*싶/i.test(text)}

function completion(title){main.innerHTML=`<div class="app-card mx-auto max-w-2xl"><div class="preview-complete"><div class="symbol">🌱</div><h2 style="font-size:24px;font-weight:800;margin-bottom:9px">${escapeHTML(title)}</h2><p style="color:var(--text);line-height:1.8;margin-bottom:24px">내 마음을 알아차린 것도 나를 돌보는 1도입니다.</p>${btn('처음으로','goHome')} ${btn('다른 마음활동 해보기','goTools',false,'ghost')}</div></div>`}

function showTool(i,scroll=true){state.tool=i;const selectors=main.querySelectorAll('.tool-select-card');selectors.forEach((b,j)=>b.classList.toggle('tool-select-card-active',i===j));const dest=main.querySelector('.tool-detail-panel');if(!dest)return;
 let detail='';const key=toolKeys[i],name=toolNames[i];
 if(i===2){const moves=['두 발을 바닥에 편하게 놓아요.','어깨를 천천히 올렸다가 내려요.','숨을 들이마시고 천천히 내쉬어요.','손에 힘을 꽉 주었다가 풀어요.','지금 내 몸이 여기 있다는 걸 느껴보세요.'];detail=`<div class="app-card" style="text-align:center;background:#F3F7EF"><p class="quiet">${state.stretch+1} / 5</p><h3 style="font-size:21px;min-height:80px;margin:16px 0">${moves[state.stretch]}</h3>${btn(state.stretch===4?'완료하기':'다음 동작','stretchNext')}</div>`;}
 else if(i===4){detail=`<p class="preview-label">지금 나에게 필요한 말을 골라보세요.</p><div class="tool-group">${warmWords.map((x,j)=>chip(x,j===0)).join('')}</div><label class="preview-label" for="tool-text">내 말로 바꿔볼래요?</label><textarea id="tool-text" class="preview-field" placeholder="내가 나에게 해주고 싶은 말"></textarea>`;}
 else if(i===5){detail=`<p class="preview-label">누구에게 편지를 보내고 싶나요?</p><div class="tool-group">${['과거의 나에게','오늘의 나에게','미래의 나에게'].map((x,j)=>chip(x,j===1)).join('')}</div><label class="preview-label" for="tool-text">마음에 떠오르는 말을 써보세요.</label><textarea id="tool-text" class="preview-field" placeholder="오늘 나에게 해주고 싶은 말은…"></textarea>`;}
 else if(i===3){detail=`<label class="preview-label" for="tool-text">지금 마음에 있는 걱정을 하나 적어보세요.</label><textarea id="tool-text" class="preview-field" placeholder="조금씩 적어도 괜찮아요."></textarea><p class="preview-label">지금 내가 할 수 있는 일인가요?</p><div class="tool-group">${['지금 할 수 있어요','나중에 할 수 있어요','내가 해결하기 어려워요','어른의 도움이 필요해요'].map((x,j)=>chip(x,j===0)).join('')}</div>`;}
 else {detail=`<label class="preview-label" for="tool-text">${['오늘 고마웠던 일은 무엇인가요?','오늘 나에게 힘이 된 순간은 무엇인가요?','','','', '', '지금 말하기 어려운 마음을 적어보세요.','지금 잠시 내려놓고 싶은 마음은 무엇인가요?'][i]}</label><textarea id="tool-text" class="preview-field" placeholder="작은 일부터 적어봐도 괜찮아요."></textarea>`;}
 dest.innerHTML=`<div class="tool-header"><span class="tool-emblem">${['🫘','🌱','🌿','🧺','☀️','💌','📒','🍃'][i]}</span><div><h3>${name}</h3><p>${toolHints[i]}</p></div></div>${detail}${i!==2?`<p class="preview-footnote">${state.mode==='practice'?'연습 모드에서는 기록이 남지 않아요.':'이 브라우저에만 저장돼요. 선생님에게 자동 전송되지 않아요.'}</p><div class="preview-actions"><span></span>${btn(state.mode==='practice'?'연습 마치기':'기록 저장하기','saveTool')}</div>`:''}`;
 if(scroll && innerWidth<900){dest.scrollIntoView({behavior:'smooth',block:'start'})}
}
function saveTool(){const input=q('#tool-text');const text=(input?.value||'').trim();const chipEl=main.querySelector('.tool-detail-panel .app-chip-selected');const chosen=chipEl?.textContent||'';if(state.tool!==4&&state.tool!==5&&!text){toast('한 줄만 적어보세요.');return;}if(helpIfNeeded(text))return;save('tool',{name:toolNames[state.tool],text,choice:chosen});completion(state.mode==='personal'?'나만의 마음기록을 남겼어요.':'오늘의 마음연습을 마쳤어요.')}
function drawRecords(){if(state.mode==='practice'){main.innerHTML=`<div class="app-card mx-auto max-w-3xl record-intro">${content('나의 마음기록')}<div class="record-intro-art">🌱</div><h3>기록은 선택이에요.</h3><p>지금은 마음연습 모드라 아무것도 저장하지 않아요.<br>개인 기기에서만 기록을 남기는 걸 추천해요.</p>${btn('개인 기기에서 기록하기','personalMode')}<p class="record-caveat">저장한 글은 비밀번호로 보호되지 않아요.</p></div>`;return}
 let records=[];for(const typ of ['mood','tool','letter']){try{records.push(...JSON.parse(localStorage.getItem('mindtemp_'+typ)||'[]'))}catch{}}
 records.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
 main.innerHTML=`<div class="app-card mx-auto max-w-4xl"><div class="section-header"><p class="section-eyebrow">내가 남긴 작은 흔적</p><h2 class="section-title">나의 마음기록</h2><p class="section-desc">잘했는지 못했는지를 보는 기록이 아니에요. 내 마음을 돌아보는 곳이에요.</p></div>${records.length?`<div class="preview-timeline">${records.map(r=>`<div><div class="preview-row"><span class="preview-time">${escapeHTML(r.date)}</span><button class="preview-delete" data-delete="${r.id}" data-type="${r.type==='mood'?'mood':'tool'}">삭제</button></div><h3 style="font-weight:800;margin:7px 0">${r.type==='mood'?'오늘 마음온도':escapeHTML(r.name||'마음도구함')}</h3><p class="quiet">${r.type==='mood'?escapeHTML(r.weather+' · '+r.emotion+' · '+r.temperature+'도'):escapeHTML(r.text||r.choice||'')}</p></div>`).join('')}</div><div style="margin-top:24px;text-align:right">${btn('모든 기록 삭제하기','clearRecords',false,'ghost')}</div>`:'<div class="preview-complete"><div class="symbol">🌱</div><p>아직 남긴 기록이 없어요.</p></div>'}<p class="preview-footnote">이 기록은 이 브라우저에서만 볼 수 있어요. 같은 브라우저를 쓰는 다른 사람도 볼 수 있습니다. 선생님에게 자동 전송하지 않아요.</p></div>`;
}
function showModal(title,msg,crisis=false){q('#overlay')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="overlay" class="preview-modal" role="dialog" aria-modal="true"><div class="preview-dialog"><h3>${escapeHTML(title)}</h3><p>${escapeHTML(msg)}</p><div class="preview-actions">${btn('닫기','closeModal',false,'ghost')}${crisis?btn('도움 안내 보기','openHelp',false,'rose'):''}</div></div></div>`)}
function showPhrase(){const text=(main.querySelector('textarea')?.value||'').trim()||state.helpPhrase;if(helpIfNeeded(text))return;showModal('이 문장을 가까운 어른에게 보여주세요.',text)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('문장을 복사했어요.')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('문장을 복사했어요.')}}
function copyFromPage(){const text=(main.querySelector('textarea')?.value||'').trim()|| (state.page==='help'?state.helpPhrase:state.page==='practice'?state.sentence:'아까 내 말을 못 들은 거야? 나는 조금 속상했어.');if(helpIfNeeded(text))return;copyText(text)}
function selectChip(button, scope){(scope||button.parentElement).querySelectorAll('.app-chip').forEach(x=>x.classList.remove('app-chip-selected'));button.classList.add('app-chip-selected')}
function navByText(text){if(text==='처음'||text==='처음으로')return 'home';if(text.includes('마음온도')&&!text.includes('오늘도'))return 'mood';if(text.includes('도구함'))return 'tools';if(text.includes('친구'))return 'friend';if(text.includes('문장'))return 'practice';if(text.includes('기록'))return 'records';if(text.includes('도움'))return 'help';return null}
function navigateToolFromLabel(text){const k=toolNames.findIndex(x=>text.includes(x));if(k>=0){go('tools');showTool(k);return true}return false}
function handleClick(e){const b=e.target.closest('button');if(!b)return;
 const act=b.dataset.action;
 if(act){if(act==='moodBack'){state.moodStep--;drawMood()}else if(act==='moodNext'){if(state.moodStep===3)finishMood();else{state.moodStep++;drawMood()}}else if(act==='stretchNext'){if(state.stretch===4){save('tool',{name:toolNames[2],text:'마음체조 완료'});completion('몸도 마음도 잠시 쉬어봤어요.')}else{state.stretch++;showTool(2,false)}}else if(act==='saveTool')saveTool();else if(act==='goHome')go('home');else if(act==='goTools')go('tools');else if(act==='personalMode')setMode('personal');else if(act==='closeModal')q('#overlay')?.remove();else if(act==='openHelp'){q('#overlay')?.remove();go('help')}else if(act==='clearRecords'){if(confirm('이 기기에 저장된 모든 마음기록을 삭제할까요? 되돌릴 수 없어요.')){['mood','tool','letter'].forEach(k=>localStorage.removeItem('mindtemp_'+k));drawRecords()}}return;}
 const del=b.dataset.delete;if(del){if(confirm('이 기록을 삭제할까요?')){let k='mindtemp_'+b.dataset.type;let arr=JSON.parse(localStorage.getItem(k)||'[]').filter(r=>r.id!==del);localStorage.setItem(k,JSON.stringify(arr));drawRecords()}return;}
 if(state.page==='home'){
  if(b.classList.contains('record-mode-choice')){const bs=[...main.querySelectorAll('.record-mode-choice')];setMode(bs.indexOf(b)===0?'practice':'personal');return}
  if(b.classList.contains('hero-cta')){go('mood');return}
  if(b.classList.contains('home-menu-card')){const k=[...main.querySelectorAll('.home-menu-card')].indexOf(b);go(['mood','tools','friend','practice','records','help'][k]||'home');return}
 }
 if(b.classList.contains('nav-pill')||b.closest('.mobile-tabbar')||b.closest('.mobile-menu-sheet')||b.classList.contains('brand-mark')){const key=navByText(b.textContent.trim());if(key){go(key);return}}
 if(b.classList.contains('crisis-float')){showModal('지금 바로 어른 도움이 필요할 수 있어요','혼자 견디기 어려운 마음이 든다면 이 사이트에 적는 것보다 가까운 어른에게 바로 말하는 것이 먼저예요.',true);return}
 if(state.page==='mood' && b.hasAttribute('data-choice')){const c=b.dataset.choice;const n=state.moodStep;if(n===0)state.weather=c;else if(n===1)state.emotion=c;else if(n===2)state.temp=parseInt(c,10);else state.recommendation=c;drawMood();return}
 if(state.page==='tools'){
  if(b.classList.contains('tool-select-card')){const i=[...main.querySelectorAll('.tool-select-card')].indexOf(b);state.stretch=0;showTool(i);return}
  if(b.hasAttribute('data-choice')){selectChip(b);return}
 }
 if(state.page==='friend'){
  if(b.classList.contains('app-chip')){selectChip(b);state.friend=b.textContent.trim();const title=main.querySelector('h3');if(title)title.textContent=state.friend;return}
  if(b.textContent.includes('복사')){copyFromPage();return}
  if(b.textContent.includes('연습 마치기')){if(helpIfNeeded(main.querySelector('textarea')?.value||''))return;completion('한 번 더 생각하는 연습을 했어요.');return}
 }
 if(state.page==='practice'){
  if(b.classList.contains('app-chip')){const cs=[...main.querySelectorAll('.app-chip')];let idx=cs.indexOf(b);if(idx<6){selectChip(b,b.parentElement);state.situation=b.textContent.trim();const lines=situationExamples[state.situation]||[];const selection=main.querySelectorAll('.app-chip')[6];const p=main.querySelectorAll('.app-chip')[7];if(selection)selection.textContent=lines[0]||'';if(p)p.textContent=lines[1]||'';state.sentence=lines[0];}else{selectChip(b,b.parentElement);state.sentence=b.textContent.trim()}return}
  if(b.textContent.includes('복사')){copyFromPage();return}
  if(b.textContent.includes('연습 마치기')){if(helpIfNeeded(main.querySelector('textarea')?.value||''))return;completion('내 마음을 말하는 문장을 연습했어요.');return}
 }
 if(state.page==='records' && b.textContent.includes('개인 기기')){setMode('personal');return}
 if(state.page==='help'){
  if(b.classList.contains('app-chip')){selectChip(b);state.helpPhrase=b.textContent.trim();return}
  const x=b.textContent.trim();if(navigateToolFromLabel(x))return;
  if(x.includes('복사')){copyFromPage();return}
  if(x.includes('크게 보여')){showPhrase();return}
  if(x.includes('어른에게 보여줄 문장')){showModal('가까운 어른에게 보여주세요.','지금 도움이 필요해요. 제 옆에 있어 주시고 함께 이야기해 주세요.');return}
  if(x.includes('전화 안내')){const box=main.querySelector('.help-numbers');if(box)box.hidden=!box.hidden;return}
  if(x.includes('보호자에게')||x.includes('상담실')){showModal('가까운 어른에게 보여주세요.',x+' 함께 가 주시거나 제 이야기를 들어주세요.');return}
 }
}
document.addEventListener('click',handleClick);
go('home');
</script>
